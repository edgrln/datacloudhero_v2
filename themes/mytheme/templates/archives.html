{% extends "blog_base.html" %}

{% block title %}Archives — {{ SITENAME }}{% endblock %}

{% block blog_content %}
<h1 class="mb-6">Archives</h1>
<ul class="list-none p-0">
    {% for article in dates %}
    <li class="mb-2">
        <span class="text-muted text-sm">{{ article.locale_date }}</span> —
        <a href="{{ SITEURL }}/{{ article.url }}" class="index-link">{{ article.title }}</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
