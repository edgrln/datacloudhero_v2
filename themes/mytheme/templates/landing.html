  <style>
    :root,
    .cc--darkmode {
      --cc-bg: #ffffff;
      --cc-primary-color: #2c2f31;
      --cc-secondary-color: #5e6266;

      --cc-btn-primary-bg: #30363c;
      --cc-btn-primary-color: #ffffff;
      --cc-btn-primary-border-color: #30363c;
      --cc-btn-primary-hover-bg: #000000;
      --cc-btn-primary-hover-color: #ffffff;
      --cc-btn-primary-hover-border-color: #000000;

      --cc-btn-secondary-bg: #eaeff2;
      --cc-btn-secondary-color: #2c2f31;
      --cc-btn-secondary-border-color: #eaeff2;
      --cc-btn-secondary-hover-bg: #d4dae0;
      --cc-btn-secondary-hover-color: #000000;
      --cc-btn-secondary-hover-border-color: #d4dae0;

      --cc-toggle-on-bg: #1bab53;
      --cc-toggle-off-bg: #667481;
      --cc-toggle-on-knob-bg: #ffffff;
      --cc-toggle-off-knob-bg: #ffffff;

      --cc-toggle-readonly-bg: #d5dee2;
      --cc-toggle-readonly-knob-bg: #ffffff;
      --cc-toggle-readonly-knob-icon-color: #d5dee2;

      --cc-cookie-category-block-bg: #f0f4f7;
      --cc-cookie-category-block-border: #f0f4f7;
      --cc-cookie-category-block-hover-bg: #e9eff4;
      --cc-cookie-category-block-hover-border: #e9eff4;

      --cc-separator-border-color: #f0f4f7;
      --cc-footer-bg: #ffffff;
      --cc-footer-color: #5e6266;
      --cc-footer-border-color: #f0f4f7;

      --cc-modal-border-radius: 0.5rem;
      --cc-btn-border-radius: 0.4rem;
    }

    #cc-main {
      color-scheme: light;
    }

    #cc-main .section__toggle:checked ~ .toggle__icon {
      background: #1bab53 !important;
      box-shadow: 0 0 0 1px #1bab53 !important;
    }

    #cc-main .section__toggle:checked ~ .toggle__icon .toggle__icon-on svg {
      stroke: #1bab53 !important;
    }

    #cc-main .section__toggle:not(:checked) ~ .toggle__icon {
      background: #667481 !important;
      box-shadow: 0 0 0 1px #667481 !important;
    }

    #cc-main .section__toggle:not(:checked) ~ .toggle__icon .toggle__icon-off svg {
      stroke: #667481 !important;
    }

    #cc-main .section__toggle:checked:disabled ~ .toggle__icon {
      background: #d5dee2 !important;
      box-shadow: 0 0 0 1px #d5dee2 !important;
    }

    #cc-main .section__toggle:checked:disabled ~ .toggle__icon .toggle__icon-circle {
      background: #ffffff !important;
    }

    #cc-main .section__toggle:checked:disabled ~ .toggle__icon svg {
      stroke: #d5dee2 !important;
    }

    #cc-main .cm,
    #cc-main .pm {
      box-shadow: 0 0.625em 1.875em rgba(0, 0, 2, 0.3);
    }

    #cc-main .pm__section:not(:first-child) {
      background: #f0f4f7;
      border-color: #f0f4f7;
    }

    #cc-main .pm__section:first-child {
      background: transparent;
    }

    #cc-main .pm__section--toggle {
      background: #f0f4f7;
    }

    #cc-main .pm__section--toggle .pm__section-title {
      background: #f0f4f7;
      border-color: #f0f4f7;
    }

    #cc-main .pm__section--toggle .pm__section-title:hover {
      background: #e9eff4;
      border-color: #e9eff4;
    }

    #cc-main .pm__section--expandable .pm__section-arrow {
      background: #d5dee2;
    }

      border-color: #eaeff2;
    }

    #cc-main .pm__close-btn:hover {
      background: #d4dae0;
      border-color: #d4dae0;

  <style>
    :root {
      --accent: #1bab53;
      --accent2: #7b61ff;
      --bg-deep: #040810;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      overflow-x: hidden;
      max-width: 100%;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg-deep);
      color: #e2e8f0;
      overflow-x: hidden;
    }

    .page-wrapper {
      max-width: 1600px;
      margin: 0 auto;
      position: relative;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .grid-bg {
      background-image:
        linear-gradient(rgba(27, 171, 83, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(27, 171, 83, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .blob1 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(27, 171, 83, 0.12) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      pointer-events: none;
      animation: drift1 12s ease-in-out infinite alternate;
    }

    .blob2 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(123, 97, 255, 0.14) 0%, transparent 70%);
      top: 200px;
      right: -50px;
      pointer-events: none;
      animation: drift2 15s ease-in-out infinite alternate;
    }

    @keyframes drift1 {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(60px, 80px);
      }
    }

    @keyframes drift2 {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(-40px, 60px);
      }
    }

    .accent-line {
      display: inline-block;
      width: 48px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      vertical-align: middle;
    }

    .hero-title {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(2rem, 10vw, 6rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.02em;
      word-break: break-word;
    }

    .hero-title .highlight {
      background: linear-gradient(135deg, #1bab53 0%, #00c8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .navbar-custom {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(4, 8, 16, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(27, 171, 83, 0.08);
      transition: background 0.4s ease;
    }

    .navbar-custom:hover {
      background: rgba(4, 8, 16, 0.88);
    }

    .navbar-inner {
      max-width: 1600px;
      margin: 0 auto;
    }

    .service-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(27, 171, 83, 0.1);
      border-radius: 16px;
      transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(27, 171, 83, 0.05), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .service-card:hover {
      transform: translateY(-6px);
      border-color: rgba(27, 171, 83, 0.4);
      box-shadow: 0 20px 50px rgba(27, 171, 83, 0.08);
    }

    .service-card:hover::before {
      opacity: 1;
    }

    .service-icon {
      width: 56px;
      height: 56px;
      background: rgba(27, 171, 83, 0.1);
      border: 1px solid rgba(27, 171, 83, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .stack-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 4px 12px;
      background: rgba(27, 171, 83, 0.06);
      border: 1px solid rgba(27, 171, 83, 0.2);
      border-radius: 999px;
      color: var(--accent);
      transition: background 0.2s;
    }

    .stack-badge:hover {
      background: rgba(27, 171, 83, 0.15);
    }

    .step-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.5rem;
      font-weight: 700;
      color: rgba(27, 171, 83, 0.15);
      line-height: 1;
    }

    .cta-section {
      background: linear-gradient(135deg, rgba(27, 171, 83, 0.06), rgba(123, 97, 255, 0.06));
      border: 1px solid rgba(27, 171, 83, 0.15);
      border-radius: 24px;
    }

    .stat-card {
      border-right: 1px solid rgba(27, 171, 83, 0.1);
    }

    .stat-card:last-child {
      border-right: none;
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition:
        opacity 0.7s ease,
        transform 0.7s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .ticker-wrap {
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker {
      display: inline-block;
      animation: ticker 22s linear infinite;
    }

    @keyframes ticker {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .btn-glow {
      background: #189a4b;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 0 0 0 rgba(24, 154, 75, 0.4);
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(24, 154, 75, 0);
      }

      50% {
        box-shadow: 0 0 24px 6px rgba(24, 154, 75, 0.25);
      }
    }

    [x-cloak] {
      display: none !important;
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#1bab53',
            accent2: '#7b61ff',
          },
        },
      },
    };
  </script>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<body
  class="grid-bg"
  x-data="{
    menuOpen: false,
    showContactForm: false,
    formData: { name: '', email: '', message: '', company: '' },
    formStartedAt: 0,
    submitting: false,
    status: '',
    error: '',
    async submitContact(evt) {
      const SCRIPT_URL = '/api/contact';
      this.error = '';
      this.status = '';
      this.submitting = true;

      try {
        const turnstileToken = evt.target.querySelector('[name=cf-turnstile-response]')?.value || '';

        const body = new URLSearchParams({
          ...this.formData,
          startedAt: String(this.formStartedAt),
          turnstileToken,
        }).toString();

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
          },
          body,
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Request failed');
        }

        this.formData = { name: '', email: '', message: '', company: '' };
        this.status = 'Message sent. Thank you!';
      } catch (err) {
        console.error(err);
        this.error = 'Something went wrong. Please email us directly instead.';
      } finally {
        this.submitting = false;
        if (window.turnstile) window.turnstile.reset();
      }
    }
  }"
  x-init="
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
        }
      });
    }, {
      threshold: 0.12,
      rootMargin: '0px 0px -40px 0px'
    });

    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
  "
>

  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  {% endif %}

{{ page.content|safe }}
