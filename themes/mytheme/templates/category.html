{% extends "base.html" %}

{% block title %}{{ category }} — {{ SITENAME }}{% endblock %}

{% block content %}
<h1 class="mb-4">Category: {{ category }}</h1>
{% for article in articles %}
<article class="mb-4 pb-3 border-bottom">
    <h2><a class="text-decoration-none article-title-link" href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a></h2>
    <p class="text-muted small">{{ article.locale_date }}</p>
    <p>{{ article.summary }}</p>
</article>
{% endfor %}
{% endblock %}
