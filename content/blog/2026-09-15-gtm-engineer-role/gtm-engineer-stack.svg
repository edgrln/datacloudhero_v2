<svg width="560" height="560" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#ffffff"/>

  <!-- Revenue action cap -->
  <rect x="160" y="20" width="240" height="50" rx="25" fill="#ffffff" stroke="#bab6b6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="280" y="41" text-anchor="middle" font-size="13" font-weight="600" fill="#605d5d">Revenue-действие</text>
  <text x="280" y="58" text-anchor="middle" font-size="11" fill="#7d7979">письмо · роутинг лида · запись в CRM</text>

  <line x1="280" y1="96" x2="280" y2="72" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- GTM Engineer layer -->
  <rect x="60" y="100" width="440" height="90" rx="14" fill="#fff3e4" stroke="#a06f24" stroke-width="1.25"/>
  <text x="84" y="134" font-size="18" font-weight="600" fill="#5a3b0a">GTM Engineer</text>
  <text x="84" y="156" font-size="13" fill="#7d5411">revenue-workflow: скоринг, роутинг, аутрич</text>
  <text x="84" y="176" font-size="11" fill="#a06f24">→ sales, marketing, RevOps</text>

  <line x1="280" y1="206" x2="280" y2="192" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Analytics Engineer layer -->
  <rect x="60" y="210" width="440" height="90" rx="14" fill="#d7d3d3" stroke="#605d5d" stroke-width="1"/>
  <text x="84" y="244" font-size="18" font-weight="600" fill="#2d2b2b">Analytics Engineer</text>
  <text x="84" y="266" font-size="13" fill="#444141">трансформации, чистые датасеты (dbt / SQL)</text>
  <text x="84" y="286" font-size="11" fill="#605d5d">→ бизнес-пользователи, self-service BI</text>

  <line x1="280" y1="316" x2="280" y2="302" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Data Engineer layer -->
  <rect x="60" y="320" width="440" height="90" rx="14" fill="#eae7e7" stroke="#7d7979" stroke-width="1"/>
  <text x="84" y="354" font-size="18" font-weight="600" fill="#2d2b2b">Data Engineer</text>
  <text x="84" y="376" font-size="13" fill="#444141">пайплайны и инфраструктура данных</text>
  <text x="84" y="396" font-size="11" fill="#7d7979">→ дата-саентисты, аналитики, вся компания</text>

  <line x1="280" y1="430" x2="280" y2="412" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Raw data cap -->
  <rect x="160" y="430" width="240" height="50" rx="25" fill="#ffffff" stroke="#bab6b6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="280" y="451" text-anchor="middle" font-size="13" font-weight="600" fill="#605d5d">Сырые данные</text>
  <text x="280" y="468" text-anchor="middle" font-size="11" fill="#7d7979">API, базы, события</text>

  <!-- Caption -->
  <text x="280" y="500" text-anchor="middle" font-size="12" fill="#605d5d" font-style="italic">Один стек, три слоя: от инфраструктуры к revenue-действию</text>

  <!-- LakedApp credit mark -->
  <g transform="translate(300,510) scale(0.5)" opacity="0.55">
    <g transform="translate(3 3)">
      <circle cx="29" cy="29" r="28" stroke="#b68235" stroke-width="1.25" fill="none"/>
      <path d="M6 34 h46" stroke="#b68235" stroke-width="1.25"/>
      <path d="M9 40 h12 M25 40 h9 M38 40 h11" stroke="#b68235" stroke-width="1.25" stroke-opacity="0.55"/>
      <path d="M18 34 l11 -17 l11 17" stroke="#201f1d" stroke-width="1.25" fill="none"/>
    </g>
    <text x="82" y="36" font-family="Cormorant Garamond, Garamond, serif" font-size="40" fill="#201f1d">LakedApp</text>
    <text x="83" y="52" font-family="Lora, Georgia, serif" font-size="9" letter-spacing="2.7" fill="#57544e">SYSTEMS &amp; SOFTWARE</text>
  </g>
</svg>
